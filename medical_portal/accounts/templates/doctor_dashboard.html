{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Dashboard</title>
  <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #74ABE2, #5563DE);
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .dashboard-container {
      background: #fff;
      padding: 2.5rem 3rem;
      border-radius: 20px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
      width: 420px;
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      color: #2a2a2a;
      margin-bottom: 1.5rem;
    }

    .profile-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #5563DE;
      margin-bottom: 1rem;
    }

    .placeholder-pic {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: #888;
      border: 3px dashed #ccc;
      margin-bottom: 1rem;
    }

    .info {
      text-align: left;
      margin: 1.2rem 0;
      font-size: 15px;
      line-height: 1.6;
    }

    .info strong {
      color: #5563DE;
    }

    .logout-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #5563DE;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s ease;
    }

    .logout-btn:hover {
      background: #3742fa;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <h2>Welcome, Dr. {{ request.user.first_name }}</h2>

    {% if request.user.profile_picture %}
      <img src="{{ request.user.profile_picture.url }}" alt="Profile Picture" class="profile-pic">
    {% else %}
      <div class="placeholder-pic">👤</div>
    {% endif %}

    <div class="info">
      <p><strong>Email:</strong> {{ request.user.email }}</p>
      <p><strong>Clinic Address:</strong> {{ request.user.address_line1 }}, {{ request.user.city }}</p>
    </div>

    <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
  </div>
</body>
</html>
